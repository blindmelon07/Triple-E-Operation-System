<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#1e40af">
    <title>Offline – Tri-E Enterprises</title>
    <style>
        :root { --bg: #f8fafc; --card: #ffffff; --text: #1e293b; --muted: #64748b; --accent: #1e40af; --border: #e2e8f0; }
        @media (prefers-color-scheme: dark) {
            :root { --bg: #0f172a; --card: #1e293b; --text: #f1f5f9; --muted: #94a3b8; --accent: #60a5fa; --border: #334155; }
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }
        .card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 32px 24px;
            max-width: 380px;
            width: 100%;
            text-align: center;
        }
        img { width: 64px; height: auto; margin-bottom: 16px; }
        h1 { font-size: 20px; margin-bottom: 8px; }
        p { color: var(--muted); font-size: 14px; line-height: 1.5; margin-bottom: 24px; }
        button {
            background: var(--accent);
            color: #fff;
            border: 0;
            border-radius: 8px;
            padding: 10px 20px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="card">
        <img src="/images/logo.png" alt="Tri-E Enterprises">
        <h1>You're offline</h1>
        <p>Tri-E needs an internet connection to load sales and inventory. Check your connection and try again.</p>
        <button type="button" onclick="location.reload()">Try again</button>
    </div>
    <script>
        window.addEventListener('online', () => location.reload());
    </script>
</body>
</html>
